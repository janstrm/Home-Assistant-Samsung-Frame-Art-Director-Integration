set_artmode:
  name: Set Art Mode
  description: Enable or disable Art Mode on the Samsung Frame TV.
  target:
    entity:
      domain: media_player
  fields:
    enabled:
      description: Whether Art Mode should be enabled.
      example: true
      required: true
      selector:
        boolean:

send_key:
  name: Send Remote Key
  description: >-
    Send a Samsung remote-control key to the selected Frame. Optionally hold
    the key using a real press/release sequence instead of repeating taps.
  target:
    entity:
      domain: media_player
  fields:
    key:
      name: Key
      description: Samsung remote key name, for example KEY_HDMI or KEY_VOLUP.
      example: KEY_HDMI
      required: true
      selector:
        text:
    hold_seconds:
      name: Hold duration
      description: Optional duration to hold the key, from 0.1 to 30 seconds.
      example: 0.8
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: seconds
          mode: box

power_on:
  name: Power On (IP Control)
  description: >-
    Request true panel power-on through Samsung IP Control. Pair IP Control
    first under Reconfigure. If the IP Control port sleeps in standby, the
    action falls back to a configured Wake-on-LAN MAC address. Availability
    from standby varies by model, firmware, network, and energy settings.
  target:
    entity:
      domain: media_player

power_off:
  name: Power Off (IP Control)
  description: >-
    Request true panel standby through Samsung IP Control. Unlike the existing
    media-player Turn Off command, this is intended to power down the panel
    rather than only leave Art Mode. Support varies by model and firmware.
  target:
    entity:
      domain: media_player

reboot:
  name: Reboot (IP Control)
  description: >-
    Request a panel reboot through Samsung IP Control. Pair IP Control first
    under Reconfigure and use it only on a trusted local network.
  target:
    entity:
      domain: media_player

rotate_art_now:
  name: Rotate Art
  description: Selects a new piece of art based on tags or source folder.
  target:
    entity:
      domain: media_player
  fields:
    tags:
      name: Tags
      description: Comma-separated list of tags to filter by (e.g. "summer, nature"). Used if source is "library".
      example: "winter, blue"
      selector:
        text:
    match_all:
      name: Match All Tags
      description: If true, art must match ALL provided tags.
      example: true
      default: false
      selector:
        boolean:
    source:
      name: Source
      description: Where to pick art from. "library" uses the database/tags. "folder" picks a random file from a directory.
      example: "library"
      default: "library"
      selector:
        select:
          options:
            - library
            - folder
    path:
      name: Folder Path
      description: Source directory for "folder" mode. Defaults to integration configuration.
      example: "/media/frame/library"
      selector:
        text:

toggle_favorite:
  name: Toggle Favorite
  description: >-
    Toggle favorite status for an artwork. If no Content ID is given, the
    currently displayed artwork on the TV is used.
  target:
    entity:
      domain: media_player
  fields:
    content_id:
      name: Content ID
      description: >-
        A TV content ID or the opaque local-... library ID. Leave empty to
        favorite the artwork currently on screen. Raw local paths are rejected.
      example: "MY-C0002_xxxxxxxx"
      selector:
        text:

cleanup_storage:
  name: Cleanup Storage
  description: Delete non-favorite images uploaded by the integration from the TV.
  target:
    entity:
      domain: media_player
  fields:
    max_items:
      description: Keep at most this many integration-managed items on the TV
      example: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box
          step: 1
    max_age_days:
      description: Delete items older than this many days (optional)
      example: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box
          step: 1
    preserve_current:
      description: Do not delete currently displayed artwork
      example: true
      selector:
        boolean:
    dry_run:
      description: Only report what would be deleted (no deletion)
      example: false
      selector:
        boolean:

upload_art:
  name: Upload Art
  description: >-
    Upload an image and display it on the Frame. The integration preprocesses the
    image to 3840 × 2160 before sending it through the TV's internal Art API. When
    a response is requested, it returns the exact TV content ID and the list of
    IDs for multiple targets.
  target:
    entity:
      domain: media_player
  fields:
    path:
      name: Path
      description: >-
        Path, trusted library ID, or URL to the image. Gallery items use an opaque
        local-... ID. Use absolute /media paths (e.g.
        /media/frame/library/example.jpg); you may also pass just a filename and it
        will assume /media/frame/library/<filename>. An http(s):// URL is also
        accepted and fetched directly (handy when the image is rendered on another
        host on the network). Remote downloads have a 30-second timeout and a 20 MiB
        limit. The URL and every redirect must match Home Assistant's
        allowlist_external_urls; embedded credentials are rejected.
      example: /media/frame/library/example.jpg
      required: true
      selector:
        text:
    matte:
      name: Matte
      description: >-
        Matte (border) id as "{style}_{color}" (e.g. shadowbox_polar) or "none".
        Leave empty to use the configured Matte Style / Matte Color.
      example: shadowbox_polar
      selector:
        text:
    tags:
      name: Tags
      description: Optional comma-separated tags to associate with this artwork.
      example: "nature, blue, calm"
      selector:
        text:

art_diagnostics:
  name: Art Diagnostics
  description: Log Art Mode support, status, current and a sample of available IDs.
  target:
    entity:
      domain: media_player

process_inbox:
  name: "Process Inbox"
  description: "Scans the configured inbox, sends each validated image to the selected AI provider (Gemini, OpenAI, or Anthropic), tags it, and moves it to the library."
  target:
    entity:
      domain: media_player

sync_library:
  name: "Sync Library"
  description: "Scans the library for untracked images and registers them with tags from the selected AI provider. Useful after manually adding files or after a database reset."
  target:
    entity:
      domain: media_player

purge_database:
  name: "Purge Database"
  description: "Wipes the local SQLite database (art history, AI tags, and favorites). Does NOT delete image files from the library folder. Run Sync Library afterwards to re-register existing images."
  target:
    entity:
      domain: media_player

delete_art:
  name: "Delete Art"
  description: "Permanently delete a tracked local artwork file and its library records. Raw filesystem paths and untracked files are rejected."
  target:
    entity:
      domain: media_player
  fields:
    content_id:
      name: Content ID
      description: "The opaque local ID exposed by the art library sensor (local-…)."
      required: true
      selector:
        text:

rotate_favorites:
  name: "Rotate Favorites"
  description: "Rotate art but only pick from images marked as favorites."
  target:
    entity:
      domain: media_player

change_gallery_page:
  name: Change Gallery Page
  description: Move the selected Frame's dashboard gallery page forward or backward.
  target:
    entity:
      domain: media_player
  fields:
    step:
      name: Step
      description: Number of pages to move; use a negative value to go backward.
      required: true
      example: 1
      selector:
        number:
          min: -100
          max: 100
          step: 1
          mode: box

