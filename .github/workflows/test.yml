name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.4
      - run: ruff check custom_components tests

  test:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum HA 2024.7
            python-version: "3.12"
            requirements: requirements_test_minimum.lock
          - name: current HA 2026.8
            python-version: "3.14"
            requirements: requirements_test.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ${{ matrix.name }} test dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Pytest
        run: >-
          pytest
          --cov=custom_components.samsung_frame_art_director
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=68
